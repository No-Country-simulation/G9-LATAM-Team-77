spring.application.name=financeia-backend

# Conexion oficial con MySQL mediante variables de entorno
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Origenes permitidos por CORS, separados por coma
financeai.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4321}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.flywaydb=DEBUG

# Clave de firma JWT configurada mediante variable de entorno
jwt.secret=${JWT_SECRET}

# Integracion Backend -> Data Science
financeai.python.command=${PYTHON_COMMAND:../../financeai-data-science/.venv/Scripts/python.exe}
financeai.data-science.script=${DATA_SCIENCE_SCRIPT:../../financeai-data-science/src/predict.py}
financeai.data-science.timeout-seconds=${DATA_SCIENCE_TIMEOUT_SECONDS:30}

# Recuperacion de contrasena y correo SMTP. Ninguna credencial se almacena en Git.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
financeai.mail.from=${MAIL_FROM:no-reply@financeai.local}
financeai.frontend.url=${FRONTEND_URL:http://localhost:4321}
financeai.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
financeai.password-reset.cooldown-seconds=${PASSWORD_RESET_COOLDOWN_SECONDS:60}

# Las respuestas de error no exponen excepciones ni trazas internas.
server.error.include-exception=false
server.error.include-message=never
server.error.include-stacktrace=never
