<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#1e293b" />
        </linearGradient>
        <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#6366f1" />
        </linearGradient>
    </defs>
    <!-- Background rounded squircle -->
    <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="3"/>

    <!-- 3 Signature Brand Dots -->
    <circle cx="44" cy="40" r="10" fill="#2563eb" />
    <circle cx="64" cy="40" r="10" fill="#ef4444" />
    <circle cx="84" cy="40" r="10" fill="#eab308" />

    <!-- Upward Trend AI Chart Line -->
    <path d="M34 88 L54 68 L72 78 L94 54" stroke="url(#aiGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Chart Arrow Head -->
    <polyline points="80 54 94 54 94 68" stroke="#6366f1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
