<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
    <defs>
        <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#090d16" />
            <stop offset="50%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#020617" />
        </linearGradient>
        <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#60a5fa" />
            <stop offset="100%" stop-color="#a855f7" />
        </linearGradient>
    </defs>
    
    <!-- Background -->
    <rect width="1200" height="630" fill="url(#ogBg)"/>
    <circle cx="1100" cy="100" r="300" fill="#2563eb" opacity="0.12" filter="blur(80px)"/>
    <circle cx="100" cy="550" r="250" fill="#9333ea" opacity="0.10" filter="blur(80px)"/>

    <!-- Grid lines -->
    <g opacity="0.08" stroke="#ffffff" stroke-width="1">
        <line x1="100" y1="0" x2="100" y2="630" />
        <line x1="300" y1="0" x2="300" y2="630" />
        <line x1="500" y1="0" x2="500" y2="630" />
        <line x1="700" y1="0" x2="700" y2="630" />
        <line x1="900" y1="0" x2="900" y2="630" />
        <line x1="1100" y1="0" x2="1100" y2="630" />
        <line x1="0" y1="150" x2="1200" y2="150" />
        <line x1="0" y1="300" x2="1200" y2="300" />
        <line x1="0" y1="450" x2="1200" y2="450" />
    </g>

    <!-- Logo Dots -->
    <circle cx="120" cy="120" r="16" fill="#2563eb" />
    <circle cx="160" cy="120" r="16" fill="#ef4444" />
    <circle cx="200" cy="120" r="16" fill="#eab308" />

    <!-- Brand Name -->
    <text x="240" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">FinanceAI</text>

    <!-- Main Heading -->
    <text x="120" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">Diagnóstico Financiero Inteligente</text>
    <text x="120" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">con Inteligencia Artificial Explicable (XAI)</text>

    <!-- Description -->
    <text x="120" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">Simulación y optimización matemática de presupuestos 50/30/20 y ratios adimensionales.</text>
    <text x="120" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">Cero venta de datos &bull; Estándares de Ciberseguridad OWASP Top 10 &bull; Multidivisa en vivo.</text>

    <!-- Badges -->
    <g transform="translate(120, 520)">
        <rect width="220" height="44" rx="12" fill="#1e293b" stroke="#334155"/>
        <text x="110" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle">Motor DS-08 (XAI)</text>
    </g>
    <g transform="translate(360, 520)">
        <rect width="230" height="44" rx="12" fill="#1e293b" stroke="#334155"/>
        <text x="115" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#4ade80" text-anchor="middle">OWASP Top 10 Verificado</text>
    </g>
    <g transform="translate(610, 520)">
        <rect width="250" height="44" rx="12" fill="#1e293b" stroke="#334155"/>
        <text x="125" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#facc15" text-anchor="middle">Garantía No-Venta de Datos</text>
    </g>
</svg>
